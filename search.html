        </div>

                <nav id="main-nav">
            <div class="nav-link">
                <a href="index.html" class="brand">webosu</a>
                <a href="new.html" class="pseudo button">New</a>
                <a href="hot.html" class="pseudo button">Hot</a>
                <a href="genre.html" class="pseudo button">Genre</a>
            </div>
            <div class="nav-search">
                <form action="search.html">
                    <input type="text" name="q" placeholder="Search beatmaps&#8230;"/>
                    <input type="image" class="search-button" src="research.svg" alt="Search">
                </form>
            </div>
            <div class="nav-tool">
                <a href="local.html" class="pseudo button">Favourites</a>
                <a href="faq.html" class="pseudo button">FAQ</a>
                <a href="en/settings.html" class="pseudo button">Settings</a>
                <label class="nav-skin-btn" id="nav-skin-btn" title="Import .osk skin">
                    <span class="nav-skin-indicator" id="nav-skin-indicator" style="display:none"></span>
                    &#127912; Skin
                    <input type="file" id="nav-skin-input" accept=".osk,.zip" style="display:none">
                </label>
            </div>
        </nav>

        <div class="main-page" id="main-page">
            <div class="main-content">
                <div class="beatmap-list" id="beatmap-list">
                    <!-- to be filled in script -->
                </div>
                <div class="button" style="width:100%; margin-bottom: 10px;" id="btnmore">加载更多</div>
                <div class="text">Recommended: latest Firefox or Chrome</div>
                <div class="text"> <a href="https://github.com/111116/osu">Github</a></div>
                <div class="text">Beatmaps by <a href="https://osu.sayobot.cn/">Sayobot</a></div>
            </div>
            <!-- <div class="side-panel">
                to be activated in script
            </div> -->
            <div class="statuslines" id="statuslines">
                <div class="progress" id="script-progress">
                    Scripts
                    <div class="lds-dual-ring"></div>
                </div>
                <div class="progress" id="skin-progress">
                    Skin
                    <div class="lds-dual-ring"></div>
                </div>
                <div class="progress" id="sound-progress">
                    Hitsounds
                    <div class="lds-dual-ring"></div>
                </div>
            </div>
        </div>
        <script>
            let url = new URL(window.location.href);
            let keyword = url.searchParams.get("q");
            // remove quotes, trailing spaces and duplicate spaces
            keyword = keyword.split('"').join(' ').trim().replace(/ +/g, ' ');
            document.getElementById("inputtext").value = keyword;
            var cur = 0;
            if (keyword == parseInt(keyword, 10)) {
                // is sid
                addBeatmapSid(keyword);
            }
            else {
                // search keyword
                addBeatmapList("https://api.sayobot.cn/beatmaplist?0=20&1=0&2=4&3=" + keyword + "&5=1");
                cur = 20;
            }
            document.getElementById("btnmore").onclick = function() {
                if (typeof(window.list_endid) == "undefined") {
                    addBeatmapList("https://api.sayobot.cn/beatmaplist?0=20&1=" + cur + "&2=4&3=" + keyword + "&5=1");
                }
                else {
                    if (window.list_endid == 0)
                        document.getElementById("btnmore").innerText = "已经没有更多了哦！";
                    else
                        addBeatmapList("https://api.sayobot.cn/beatmaplist?0=20&1=" + window.list_endid + "&2=4&3=" + keyword + "&5=1");
                }
                cur += 20;
            }
        </script>

<!-- Skin toast -->
<div class="skin-toast" id="skin-toast"></div>
<script>
function showSkinToast(msg){var t=document.getElementById('skin-toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(function(){t.classList.remove('show');},3000);}
(function(){var navInput=document.getElementById('nav-skin-input');var navInd=document.getElementById('nav-skin-indicator');if(!navInput)return;navInput.addEventListener('change',function(){var file=navInput.files[0];if(!file)return;navInput.value='';var ext=file.name.split('.').pop().toLowerCase();if(ext!=='osk'&&ext!=='zip'){showSkinToast('Please use a .osk file');return;}if(!window.SkinLoader){showSkinToast('Skin loader not ready');return;}showSkinToast('Loading skin...');SkinLoader.load(file,function(){},function(name){if(navInd)navInd.style.display='inline-block';showSkinToast('Skin loaded: '+name);},function(e){showSkinToast('Skin error: '+e);});});if(window.SkinLoader&&SkinLoader.getSavedSkinName()&&navInd)navInd.style.display='inline-block';window.addEventListener('DOMContentLoaded',function(){if(window.SkinLoader&&SkinLoader.getSavedSkinName()&&navInd)navInd.style.display='inline-block';});})();
</script>
    </body>
</html>
