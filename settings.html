<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Settings — webosu</title>

    <link rel="stylesheet" href="../style/normalize.css">
    <link rel="stylesheet" href="../style/font.css">
    <link rel="stylesheet" href="../style/main.css">
    <link rel="icon" href="../favicon.png">

    <script src="../scripts/lib/localforage.min.js"></script>
    <script src="../scripts/settings.js"></script>
    <script src="../scripts/lib/zip.js"></script>
    <script src="../scripts/lib/z-worker.js"></script>
    <script src="../scripts/skinloader.js"></script>

    <style>
        .settings-row {
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:12px 0;
            border-bottom:1px solid rgba(255,255,255,0.04);
        }

        .settings-row:last-child {
            border-bottom:none;
        }

        .opt-name {
            color:var(--text-secondary);
            font-size:0.9em;
            flex:1;
        }

        .opt-name small {
            display:block;
            color:var(--text-muted);
            font-size:0.82em;
            margin-top:2px;
        }

        .settings-row.non-default .opt-name {
            color:var(--accent);
        }

        .opt-ctrl {
            display:flex;
            align-items:center;
            gap:8px;
            flex-shrink:0;
        }

        .tog {
            position:relative;
            width:40px;
            height:22px;
            flex-shrink:0;
        }

        .tog input {
            opacity:0;
            width:0;
            height:0;
            position:absolute;
        }

        .tog-track {
            position:absolute;
            inset:0;
            background:#2a2a2a;
            border-radius:22px;
            cursor:pointer;
            transition:background 0.2s;
        }

        .tog-track::before {
            content:"";
            position:absolute;
            width:16px;
            height:16px;
            left:3px;
            top:3px;
            background:#555;
            border-radius:50%;
            transition:0.2s;
        }

        .tog input:checked + .tog-track {
            background:var(--accent-dark);
        }

        .tog input:checked + .tog-track::before {
            transform:translateX(18px);
            background:#fff;
        }

        .rng-wrap {
            position:relative;
        }

        .rng-wrap input[type="range"] {
            display:block;
        }

        .range-indicator {
            position:absolute;
            background:var(--bg-secondary);
            border:1px solid var(--border-light);
            border-radius:4px;
            padding:1px 6px;
            font-size:0.75em;
            color:var(--text-primary);
            top:-26px;
            pointer-events:none;
            white-space:nowrap;
        }

        .keybtn {
            background:var(--bg-input);
            border:1px solid var(--border-light);
            border-radius:6px;
            color:var(--text-primary);
            padding:4px 14px;
            min-width:50px;
            font-size:0.85em;
            font-family:monospace;
            cursor:pointer;
            transition:border-color 0.15s;
        }

        .keybtn:hover {
            border-color:var(--accent);
        }

        .keybtn.using {
            border-color:var(--accent);
            background:var(--accent-dark);
            color:#fff;
        }

        .sec-title {
            font-size:0.72em;
            font-weight:700;
            letter-spacing:0.12em;
            text-transform:uppercase;
            color:var(--accent);
            margin:0 0 14px 0;
            padding-bottom:8px;
            border-bottom:1px solid var(--border);
        }

        .card {
            background:var(--bg-card);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            padding:20px 24px;
            margin-bottom:16px;
        }

        .mod-check-row {
            display:flex;
            align-items:center;
            gap:10px;
            padding:10px 0;
            border-bottom:1px solid rgba(255,255,255,0.04);
        }

        .mod-check-row:last-child {
            border-bottom:none;
        }

        .mod-check-row .mod-lbl {
            flex:1;
        }

        .mod-check-row .mod-badge {
            font-size:0.72em;
            background:var(--bg-input);
            border:1px solid var(--border);
            border-radius:4px;
            padding:1px 6px;
            color:var(--text-muted);
        }

        .mod-check-row.relax-row .mod-badge {
            color:#f6a;
            border-color:#c06080;
        }

        .skin-drop {
            border:2px dashed var(--border-light);
            border-radius:var(--radius);
            padding:28px;
            text-align:center;
            cursor:pointer;
            transition:all 0.2s;
            color:var(--text-muted);
            background:var(--bg-input);
        }

        .skin-drop:hover,
        .skin-drop.dragover {
            border-color:var(--accent);
            background:rgba(59,165,93,0.06);
            color:var(--text-secondary);
        }

        .skin-drop .icon {
            font-size:2em;
            margin-bottom:6px;
        }

        .skin-drop p {
            margin:3px 0;
            font-size:0.88em;
        }

        .skin-active {
            display:none;
            align-items:center;
            gap:10px;
            background:rgba(59,165,93,0.1);
            border:1px solid var(--accent-dark);
            border-radius:var(--radius);
            padding:10px 14px;
            font-size:0.88em;
            color:var(--accent);
            margin-top:10px;
        }

        .skin-active.visible {
            display:flex;
        }

        .skin-clear {
            margin-left:auto;
            cursor:pointer;
            color:var(--text-muted);
            transition:color 0.15s;
            font-size:1.1em;
        }

        .skin-clear:hover {
            color:#ff6666;
        }

        .skin-prog {
            display:none;
            align-items:center;
            gap:10px;
            padding:8px 0;
            color:var(--text-muted);
            font-size:0.88em;
        }

        .skin-prog.visible {
            display:flex;
        }

        .skin-prog-bar {
            flex:1;
            height:4px;
            background:var(--border);
            border-radius:2px;
            overflow:hidden;
        }

        .skin-prog-fill {
            height:100%;
            background:var(--accent);
            border-radius:2px;
            transition:width 0.2s;
            width:0;
        }

        .restore-btn {
            background:var(--bg-card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            color:var(--text-secondary);
            padding:8px 20px;
            cursor:pointer;
            font-size:0.9em;
            font-family:inherit;
            transition:all 0.15s;
        }

        .restore-btn:hover {
            border-color:var(--accent);
            color:var(--accent);
        }

        .page-wrap {
            max-width:700px;
            margin:0 auto;
            padding:16px 16px 60px 16px;
        }

        .page-title {
            font-size:1.5em;
            font-weight:700;
            color:var(--text-primary);
            margin:0 0 20px 0;
        }

        .back-link {
            color:var(--accent);
            font-size:0.9em;
            display:inline-flex;
            align-items:center;
            gap:4px;
            margin-bottom:16px;
        }

        .back-link:hover {
            color:#5bc97a;
        }
    </style>
</head>

<body>
<nav id="main-nav">
    <div class="nav-link">
        <a href="../index.html" class="brand">webosu</a>
    </div>

    <div class="nav-tool">
        <a href="../index.html" class="pseudo button">Home</a>
        <a href="../new.html" class="pseudo button">New</a>
        <a href="../hot.html" class="pseudo button">Hot</a>
        <a href="../local.html" class="pseudo button">Favourites</a>
        <a href="settings.html" class="pseudo button active">Settings</a>
    </div>
</nav>

<div class="main-page">
<div class="page-wrap" id="settings-panel">

    <h1 class="page-title">⚙ Settings</h1>

</div>
</div>

<script>
(function() {

    document.addEventListener('DOMContentLoaded', function() {

        document.querySelectorAll('.settings-row, .mod-check-row').forEach(function(row) {

            row.querySelectorAll('input').forEach(function(inp) {

                inp.addEventListener('change', function() {

                });

            });

        });

        var dropZone = document.getElementById('skin-drop-zone');
        var fileInput = document.getElementById('skin-file-input');
        var progressBar = document.getElementById('skin-progress-bar');
        var progFill = document.getElementById('skin-prog-fill');
        var activeBar = document.getElementById('skin-active');
        var activeName = document.getElementById('skin-active-name');
        var clearBtn = document.getElementById('skin-clear-btn');

        if (window.SkinLoader && SkinLoader.getSavedSkinName()) {
            activeName.textContent = SkinLoader.getSavedSkinName();
            activeBar.classList.add('visible');
        }

        function handleSkinFile(file) {

            if (!file) return;

            var ext = file.name.split('.').pop().toLowerCase();

            if (ext !== 'osk' && ext !== 'zip') {
                showToast('Please select a .osk file (rename your skin zip to .osk)');
                return;
            }

            progressBar.classList.add('visible');
            activeBar.classList.remove('visible');
            progFill.style.width = '0%';

            if (!window.SkinLoader) {
                showToast('Skin loader not ready — try refreshing the page');
                progressBar.classList.remove('visible');
                return;
            }

            SkinLoader.load(
                file,

                function onProgress(pct) {
                    progFill.style.width = pct + '%';
                },

                function onComplete(name) {
                    progressBar.classList.remove('visible');
                    activeName.textContent = name;
                    activeBar.classList.add('visible');
                    showToast('Skin loaded: ' + name);
                },

                function onError(e) {
                    progressBar.classList.remove('visible');
                    showToast('Failed to load skin: ' + e);
                }
            );
        }

        dropZone.addEventListener('click', function() {
            fileInput.click();
        });

        fileInput.addEventListener('change', function() {
            handleSkinFile(fileInput.files[0]);
            fileInput.value = '';
        });

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', function() {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleSkinFile(e.dataTransfer.files[0]);
        });

        clearBtn.addEventListener('click', function() {

            if (window.SkinLoader) {
                SkinLoader.reset();
            }

            activeBar.classList.remove('visible');
            showToast('Skin removed — using default skin');
        });

    });

    window.showToast = function(msg) {

        var t = document.getElementById('_toast');

        if (!t) {
            t = document.createElement('div');
            t.id = '_toast';
            t.className = 'skin-toast';
            document.body.appendChild(t);
        }

        t.textContent = msg;
        t.classList.add('show');

        clearTimeout(t._timer);

        t._timer = setTimeout(function() {
            t.classList.remove('show');
        }, 3000);
    };

})();
</script>

</body>
</html>
