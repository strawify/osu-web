                <nav id="main-nav">

                    <div class="selitem" genre="32">流行</div>
                    <div class="selitem" genre="128">新奇</div>
                    <div class="selitem" genre="1024">电子</div>
                    <div class="selitem" genre="2+64+256">其它</div>
                </div>
                <div class="sort-nav">
                    <div class="title">语言</div>
                    <div class="selitem" lang="1">全部</div>
                    <div class="selitem" lang="16">汉语</div>
                    <div class="selitem" lang="4">英语</div>
                    <div class="selitem" lang="8">日语</div>
                    <div class="selitem" lang="32">器乐</div>
                    <div class="selitem" lang="64">韩语</div>
                    <div class="selitem" lang="128">法语</div>
                    <div class="selitem" lang="256">德语</div>
                    <div class="selitem" lang="2048">意大利语</div>
                    <div class="selitem" lang="512">瑞典语</div>
                    <div class="selitem" lang="2+1024">其它</div>

                <hr>

                <div class="beatmap-list" id="beatmap-list">
                    <!-- to be filled in script -->
                </div>

            <!-- <div class="side-panel">
                to be activated in script
            </div> -->

                <div class="progress" id="script-progress">
                    Scripts
                    <div class="lds-dual-ring"></div>
                </div>
                <div class="progress" id="skin-progress">
                    Skin
                    <div class="lds-dual-ring"></div>
                </div>
                <div class="progress" id="sound-progress">
                    Hitsounds
                    <div class="lds-dual-ring"></div>
                </div>
            </div>
        </div>
        <script>
            let btns = document.getElementsByClassName("selitem");
            function search(genre, lang) {
                // clear list
                list = document.getElementById("beatmap-list");
                document.getElementById("btnmore").innerText = "查看更多";
                while (list.firstChild) {
                    list.removeChild(list.firstChild);
                }
                addBeatmapList("https://api.sayobot.cn/beatmaplist?0=20&1=0&2=4&5=1&7=" + genre + "&8=" + lang);
                var cur = 20;
                document.getElementById("btnmore").onclick = function() {
                    if (typeof(window.list_endid) == "undefined") {
                        addBeatmapList("https://api.sayobot.cn/beatmaplist?0=20&1="+cur+"&2=4&5=1&7=" + genre + "&8=" + lang);
                    }
                    else {
                        if (window.list_endid == 0)
                            document.getElementById("btnmore").innerText = "已经没有更多了哦！";
                        else
                            addBeatmapList("https://api.sayobot.cn/beatmaplist?0=20&1="+window.list_endid+"&2=4&5=1&7=" + genre + "&8=" + lang);
                    }
                    cur += 20;
                }
                // update buttons state
                for (let i=0; i<btns.length; ++i) {
                    let g = eval(btns[i].getAttribute("genre"));
                    let l = eval(btns[i].getAttribute("lang"));
                    if (g==genre || l==lang) {
                        btns[i].classList.add("active");
                    }
                    else {
                        btns[i].classList.remove("active");
                    }
                }
            }
            let curgenre = 1;
            let curlang = 1;
            search(curgenre, curlang);
            for (let i=0; i<btns.length; ++i) {
                btns[i].onclick = function() {
                    let g = eval(btns[i].getAttribute("genre"));
                    let l = eval(btns[i].getAttribute("lang"));
                    if (g) curgenre = g;
                    if (l) curlang = l;
                    search(curgenre, curlang);
                }
            }
        </script>

<!-- Skin toast -->
<div class="skin-toast" id="skin-toast"></div>
<script>
function showSkinToast(msg){var t=document.getElementById('skin-toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(function(){t.classList.remove('show');},3000);}
(function(){var navInput=document.getElementById('nav-skin-input');var navInd=document.getElementById('nav-skin-indicator');if(!navInput)return;navInput.addEventListener('change',function(){var file=navInput.files[0];if(!file)return;navInput.value='';var ext=file.name.split('.').pop().toLowerCase();if(ext!=='osk'&&ext!=='zip'){showSkinToast('Please use a .osk file');return;}if(!window.SkinLoader){showSkinToast('Skin loader not ready');return;}showSkinToast('Loading skin...');SkinLoader.load(file,function(){},function(name){if(navInd)navInd.style.display='inline-block';showSkinToast('Skin loaded: '+name);},function(e){showSkinToast('Skin error: '+e);});});if(window.SkinLoader&&SkinLoader.getSavedSkinName()&&navInd)navInd.style.display='inline-block';window.addEventListener('DOMContentLoaded',function(){if(window.SkinLoader&&SkinLoader.getSavedSkinName()&&navInd)navInd.style.display='inline-block';});})();
</script>
    </body>
</html>
